<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Register</title>

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <link rel="stylesheet"
        href="style.css">

</head>


<body>

    <header>

        <nav class="navbar">

            <h2 class="logo">
                <B><I>CINNAMOROLL</I> BAKERY SHOP</B>
            </h2>


            <ul>

                <li>
                    <a href="index.html">
                        Login
                    </a>
                </li>

                <li>
                    <a href="registration.html">
                        Registration
                    </a>
                </li>

                <li>
                    <a href="#contact">
                        Contact
                    </a>
                </li>

            </ul>

        </nav>

    </header>


    <section
        id="login"
        class="maincon"
    >


        <div class="image">

            <img
                src="profile (1).jpg"
                alt="Profile Picture"
            >

        </div>


        <div class="loghead">

            <h1>
                Register Account
            </h1>

        </div>


        <div class="txtb">

            <form id="registerForm">


                <label>

                    Full Name

                    <i class="fa-solid fa-user"></i>

                </label>


                <input
                    type="text"
                    id="fullName"
                    placeholder="Enter your full name"
                >


                <label>

                    Username

                    <i class="fa-solid fa-user"></i>

                </label>


                <input
                    type="text"
                    name="text"
                    id="itxtbox"
                    class="ctxtbox"
                    placeholder="Create an username"
                    autocomplete="username"
                >


                <label>

                    Email

                    <i class="fa-solid fa-envelope"></i>

                </label>


                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email address"
                    autocomplete="email"
                >


                <label>

                    Password

                    <i class="fa-solid fa-lock"></i>

                </label>


                <input
                    type="password"
                    name="password"
                    id="ipassbox"
                    class="cpassbox"
                    placeholder="Create a password"
                    autocomplete="new-password"
                >


                <label>

                    Re-enter Password

                    <i class="fa-solid fa-lock"></i>

                </label>


                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Re-enter your password"
                    autocomplete="new-password"
                >


                <button type="submit">
                    Create Account
                </button>


            </form>

        </div>


        <div class="new">


            <p>

                <a href="forgotpass.html">
                    Forgot password?
                </a>

            </p>


            <p>

                Already have an account?

                <a href="index.html">
                    Login now.
                </a>

            </p>


        </div>


    </section>


    <section
        id="contact"
        class="contact"
    >

        <h2>
            Contact Me
        </h2>


        <p>
            Email: denmarkpogi@pdm.com
        </p>


        <p>
            Phone: 0921-143-0501
        </p>

    </section>


    <footer>

        <p>
            © 2026 PDM Student | Student Website
        </p>

    </footer>


    <script src="javascript.js"></script>

</body>

</html>
